spring.application.name=producer
server.port=8443

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=ecommercedb

server.ssl.key-store=classpath:server-keystore.p12
server.ssl.key-store-password=pass1234
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=server

server.ssl.trust-store=classpath:server-truststore.p12
server.ssl.trust-store-password=pass1234
server.ssl.trust-store-type=PKCS12

server.ssl.client-auth=need

producer.private.key.path=keys/producer_private.key
producer.public.key.path=keys/producer_public.key
consumer.public.key.path=keys/consumer_public.key